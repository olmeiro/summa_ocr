# Job del workflow. Por ahora una sola tarea de humo; las features siguientes añaden los steps.

resources:
  jobs:
    summa_workflow:
      name: summa_workflow
      description: Workflow de procesamiento e indexación de documentos de SUMMA
      tags:
        proyecto: summa-ai
        ambiente: ${bundle.target}
      timeout_seconds: 3600
      max_concurrent_runs: 1

      # Trigger semanal: pausado en dev y activo en prod (tech-stack §8)
      schedule:
        quartz_cron_expression: ${var.trigger_cron}
        timezone_id: ${var.trigger_zona}
        pause_status: ${var.trigger_pausa}

      # Cómputo serverless (DEC-002): las tareas comparten este environment
      environments:
        - environment_key: serverless
          spec:
            environment_version: ${var.environment_version}
            dependencies:
              - ../../repo_libreria/dist/summa_ai_framework-${var.libreria_version}-py3-none-any.whl

      tasks:
        - task_key: s00_humo
          description: Comprueba el runtime y la librería instalada en el environment
          environment_key: serverless
          spark_python_task:
            python_file: ../src/steps/s00_humo.py
            parameters:
              - --ambiente
              - ${bundle.target}
